name: ANN CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  quality:
    name: ANN quality checks
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: 01_ANN

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: "0.12.0"
          enable-cache: false

      - name: Install pinned Python
        run: uv python install

      - name: Install dependencies
        run: uv sync --locked

      - name: Verify package import
        run: uv run --locked python -c "import bank_churn; print(bank_churn.__file__)"

      - name: Check linting
        run: uv run --locked ruff check .

      - name: Check formatting
        run: uv run --locked ruff format --check .

      - name: Check types
        run: uv run --locked mypy